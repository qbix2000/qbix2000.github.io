<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isometric</title>
    <link rel="stylesheet" href="style.css">
    <script src="./scripts/script.js"></script>  
</head>
<body>
    <div class="container">
        <!-- Top 1/4 section -->
        <div class="top-section">
            <div class="header-box">
                <bluetooth-icon id="header-bt"></bluetooth-icon>
                <div class="value-display">
                    <span id="weight-display" class="number">0</span>
                    <span class="unit">kg</span>
                </div>
            </div>
        </div>

        <!-- Remaining 3/4 content area -->
        <div class="content-section">
            <input id="weight-range" type="range" min="0" max="999.9" style="width:100%;" value="0" onInput="updateWeight();" />
            <div class="peak-container">
              <div class="peak-card">
                <span class="peak-label">PEAK WEIGHT</span>
                <div class="peak-value-group">
                  <span id="set-peak-display">0.0</span><span class="unit">kg</span>
                </div>
              </div>
              <button id="reset-peak-btn" onclick="resetPeakWeight()" aria-label="Reset peak weight">
                Clear
              </button>
            </div>            
            <div class="input">
                <button class="nav-btn" data-input-id="target-weight">-</button>
                <div class="display-box">
                    <div class="value-display">
                        <input type="number" id="target-weight" class="number" value="30" min="0" max="500" />
                        <span class="unit">kg</span>
                    </div>
                </div>
                <button class="nav-btn" data-input-id="target-weight">+</button>
            </div>
            <div class="input">
                <button class="nav-btn" data-input-id="time-input">-</button>
                <div class="display-box">
                    <div class="value-display">
                        <input type="number" id="time-input" class="number" value="6" min="0" max="99" />
                        <span class="unit">s</span>
                    </div>
                </div>
                <button class="nav-btn" data-input-id="time-input">+</button>
            </div>
            <button class="bt-btn" aria-label="Connect Bluetooth" onClick="connectBluetooth();">
                <bluetooth-icon id="bt-action"></bluetooth-icon>
            </button>
        </div>
    </div>
</body>
</html>
